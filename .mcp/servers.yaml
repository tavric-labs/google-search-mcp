version: v1
servers:
    - name: google-search
      description: Generic token-efficient Google web search for any topic — craft queries, slim SERPs, selective page open, citation packs. Clients send X-Google-Api-Key.
      image: registry.mcpruntime.org/org/google-search-mcp/google-search
      imageTag: latest
      route: /google-search/mcp
      publicPathPrefix: google-search
      ingressHost: mcp.mcpruntime.org
      port: 8080
      replicas: 1
      envVars:
        - name: GOOGLE_CSE_ID
          value: <platform programmable search engine cx>
        - name: GOOGLE_SEARCH_MAX_RESULTS
          value: "5"
        - name: GOOGLE_SEARCH_MAX_PARALLEL
          value: "3"
      namespace: mcp-servers
      auth:
        mode: header
        headers: [X-Google-Api-Key]
        credentialPresence: all
        credentialGateway:
          validationPath: /auth/check
      tools:
        - name: google_craft_query
          description: Design targeted Google queries from any plain-language goal without calling Google.
          requiredTrust: low
          sideEffect: read
        - name: google_search
          description: Generic Custom Search for any topic; return slim hits.
          requiredTrust: low
          sideEffect: read
        - name: google_multi_search
          description: Run up to three queries in parallel and dedupe hits.
          requiredTrust: low
          sideEffect: read
        - name: google_open
          description: Extract a short text window from one hit or URL.
          requiredTrust: medium
          sideEffect: read
        - name: google_pack_evidence
          description: Build a short citation pack from selected hits.
          requiredTrust: low
          sideEffect: read
      policy:
        mode: allow-list
        defaultDecision: deny
