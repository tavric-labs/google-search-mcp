version: v1
servers:
    - name: google-search
      description: Public Google web search via Gemini Search grounding — craft queries, slim SERPs, selective page open, citation packs. No client login; platform holds the Gemini key. Gateway audit records tool use.
      image: registry.mcpruntime.org/public/google-search-mcp
      imageTag: v0.2.0
      route: /google-search/mcp
      publicPathPrefix: google-search
      ingressHost: mcp.mcpruntime.org
      port: 8080
      replicas: 1
      scope: public
      envVars:
        - name: GEMINI_MODEL
          value: gemini-2.5-flash
        - name: GOOGLE_SEARCH_MAX_RESULTS
          value: "5"
        - name: GOOGLE_SEARCH_MAX_PARALLEL
          value: "3"
      secretEnvVars:
        - name: GEMINI_API_KEY
          secretKeyRef:
            name: google-search-mcp-secrets
            key: GEMINI_API_KEY
      namespace: mcp-servers-public
      auth:
        mode: none
      tools:
        - name: google_craft_query
          description: Design targeted Google queries from any plain-language goal without calling Google.
          requiredTrust: low
          sideEffect: read
        - name: google_search
          description: Generic Google web search via Gemini grounding; return slim hits.
          requiredTrust: low
          sideEffect: read
        - name: google_multi_search
          description: Run up to three queries in parallel and dedupe hits.
          requiredTrust: low
          sideEffect: read
        - name: google_open
          description: Extract a short text window from one hit or URL.
          requiredTrust: medium
          sideEffect: read
        - name: google_pack_evidence
          description: Build a short citation pack from selected hits.
          requiredTrust: low
          sideEffect: read
      policy:
        mode: observe
        defaultDecision: allow
        enforceOn: call_tool
        policyVersion: v1
      gateway:
        enabled: true
