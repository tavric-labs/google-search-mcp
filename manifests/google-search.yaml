apiVersion: mcpruntime.org/v1alpha1
kind: MCPServer
metadata:
  name: google-search
  namespace: mcp-servers-public
  labels:
    mcpruntime.org/scope: public
spec:
  description: Public Google web search via Gemini Search grounding. No platform login; send X-Gemini-Api-Key. Gateway audit records tool use.
  image: registry.mcpruntime.org/public/google-search
  imageTag: v0.2.0
  replicas: 1
  port: 8080
  servicePort: 80
  publicPathPrefix: google-search
  ingressHost: mcp.mcpruntime.org
  ingressPath: /google-search/mcp
  envVars:
    - name: GEMINI_MODEL
      value: gemini-2.5-flash
    - name: GOOGLE_SEARCH_MAX_RESULTS
      value: "5"
    - name: GOOGLE_SEARCH_MAX_PARALLEL
      value: "3"
  secretEnvVars:
    - name: GEMINI_API_KEY
      secretKeyRef:
        name: google-search-mcp-secrets
        key: GEMINI_API_KEY
  auth:
    mode: header
    headers:
      - X-Gemini-Api-Key
    credentialPresence: all
  tools:
    - name: google_craft_query
      description: Design targeted Google queries from any plain-language goal without calling Google.
      requiredTrust: low
      sideEffect: read
    - name: google_search
      description: Generic Google web search via Gemini grounding; return slim hits.
      requiredTrust: low
      sideEffect: read
    - name: google_multi_search
      description: Run up to three queries in parallel and dedupe hits.
      requiredTrust: low
      sideEffect: read
    - name: google_open
      description: Extract a short text window from one hit or URL.
      requiredTrust: medium
      sideEffect: read
    - name: google_pack_evidence
      description: Build a short citation pack from selected hits.
      requiredTrust: low
      sideEffect: read
  policy:
    mode: allow-list
    defaultDecision: deny
    enforceOn: call_tool
    policyVersion: v1
    delegatedToolRules:
      - name: google_craft_query
        decision: allow
      - name: google_search
        decision: allow
      - name: google_multi_search
        decision: allow
      - name: google_open
        decision: allow
      - name: google_pack_evidence
        decision: allow
  gateway:
    enabled: true
